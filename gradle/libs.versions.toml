[versions]
annotations = "23.0.0"
asm = "9.10.1"
jsr305 = "3.0.2"

junit = "5.8.2"
junit-platform = "1.8.2"

[plugins]
mavenPublish = { id = "com.vanniktech.maven.publish", version = "0.34.0" }

[libraries]
annotations = { group = "org.jetbrains", name = "annotations", version.ref = "annotations" }
jsr305 = { group = "com.google.code.findbugs", name = "jsr305", version.ref = "jsr305" }

asm = { group = "org.ow2.asm", name = "asm", version.ref = "asm" }
asm-commons = { group = "org.ow2.asm", name = "asm-commons", version.ref = "asm" }

junit-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit" }
junit-engine = { group = "org.junit.jupiter", name = "junit-jupiter-engine", version.ref = "junit" }
junit-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit-platform" }
